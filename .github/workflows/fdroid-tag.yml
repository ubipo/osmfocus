name: F-Droid tag

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compute F-Droid tag
        id: version
        run: |
          version_kvs="$(python3 scripts/vcs_version.py)"
          get_version_value() {
            printf '%s\n' "$version_kvs" | grep -m1 "^$1=" | cut -d= -f2-
          }
          if [ "$(get_version_value is_head_tagged)" != "true" ]; then
            echo "is_tagged=false" >> "$GITHUB_OUTPUT"
            release_tag="$(get_version_value release_tag)"
            echo "HEAD is not tagged with the latest semver release tag ($release_tag); skipping."
            exit 0
          fi

          echo "is_tagged=true" >> "$GITHUB_OUTPUT"
          fdroid_tag="$(get_version_value fdroid_tag)"
          echo "fdroid_tag=$fdroid_tag" >> "$GITHUB_OUTPUT"
          echo "Computed F-Droid tag: $fdroid_tag"

      - name: Create tag if missing
        if: steps.version.outputs.is_tagged == 'true'
        env:
          fdroid_tag: ${{ steps.version.outputs.fdroid_tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$fdroid_tag" >/dev/null; then
            echo "Tag $fdroid_tag already exists; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          # 41898282 is GitHub's numeric user ID for github-actions[bot]:
          # https://github.com/orgs/community/discussions/26560#discussioncomment-3531273
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$fdroid_tag"
          git push origin "refs/tags/$fdroid_tag"
