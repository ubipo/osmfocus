name: Release new app version

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version_meta:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_head_tagged: ${{ steps.meta.outputs.is_head_tagged }}
      fdroid_tag: ${{ steps.meta.outputs.fdroid_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Compute version metadata
        id: meta
        shell: bash
        run: |
          set -o pipefail
          bash scripts/vcs_version.sh | tee -a "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    needs: version_meta
    if: needs.version_meta.outputs.is_head_tagged == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run tests
        run: ./gradlew test

  github_release:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure signing keystore
        run: |
          echo "$ANDROID_SIGNING_KEYSTORE_JKS_B64" | base64 -id > android-signing-keystore.jks
        env:
          ANDROID_SIGNING_KEYSTORE_JKS_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_JKS_B64 }}

      - name: Build signed OSS APK
        run: ./gradlew app:assembleFdroidRelease
        env:
          SIGNING_KEYSTORE_FILE: android-signing-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version_meta.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Upload signed OSS APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version_meta.outputs.release_tag }}
        run: |
          apk_path="$(find app/build/outputs/apk/fdroid/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          asset_name="net.pfiers.osmfocus-${RELEASE_TAG#v}-oss.apk"
          gh release upload "$RELEASE_TAG" "$apk_path#$asset_name" --clobber

  fdroid_tag:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Create F-Droid tag if missing
        env:
          FDROID_TAG: ${{ needs.version_meta.outputs.fdroid_tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$FDROID_TAG" >/dev/null; then
            echo "Tag $FDROID_TAG already exists; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          # 41898282 is GitHub's numeric user ID for github-actions[bot]:
          # https://github.com/orgs/community/discussions/26560#discussioncomment-3531273
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$FDROID_TAG"
          git push origin "refs/tags/$FDROID_TAG"

  gplay_deploy:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure credentials
        run: |
          echo "$ANDROID_SIGNING_KEYSTORE_JKS_B64" | base64 -id > android-signing-keystore.jks
          echo "$PLAY_STORE_CREDENTIALS_JSON_B64" | base64 -id > play-store-credentials.json
        env:
          ANDROID_SIGNING_KEYSTORE_JKS_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_JKS_B64 }}
          PLAY_STORE_CREDENTIALS_JSON_B64: ${{ secrets.PLAY_STORE_CREDENTIALS_JSON_B64 }}

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6
        with:
          ruby-version: '4.0.4'

      - name: Bundle install
        run: bundle install
        working-directory: fastlane

      - name: Fastlane deploy
        run: bundle exec fastlane production
        working-directory: fastlane
        env:
          SIGNING_KEYSTORE_FILE: ../android-signing-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
