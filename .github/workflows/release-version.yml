name: Release new app version

on:
  push:
    tags:
      - 'dev/v*.*.*'
  workflow_dispatch:
    inputs:
      dev_tag:
        description: 'Release source tag (format: dev/vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version_meta:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      semver: ${{ steps.meta.outputs.semver }}
      android_code: ${{ steps.meta.outputs.android_code }}
      release_commit: ${{ steps.stamp.outputs.release_commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.dev_tag) || github.ref }}

      - name: Verify tag commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

      - name: Compute version metadata
        id: meta
        shell: bash
        env:
          INPUT_DEV_TAG: ${{ inputs.dev_tag }}
        run: |
          set -o pipefail
          trigger_tag="${INPUT_DEV_TAG:-${{ github.ref_name }}}"

          if [[ ! "$trigger_tag" =~ ^dev/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: '$trigger_tag'. Expected format dev/vX.Y.Z" >&2
            exit 1
          fi

          python3 scripts/version.py get "$trigger_tag" | tee -a "$GITHUB_OUTPUT"
          semver="$(grep '^semver=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          echo "release_tag=v$semver" | tee -a "$GITHUB_OUTPUT"

      - name: Stamp and commit release
        id: stamp
        shell: bash
        env:
          SEMVER: ${{ steps.meta.outputs.semver }}
          ANDROID_CODE: ${{ steps.meta.outputs.android_code }}
        run: |
          python3 scripts/version.py stamp "$SEMVER" "$ANDROID_CODE"

          git config user.name "github-actions[bot]"
          # 41898282 is GitHub's numeric user ID for github-actions[bot].
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Version stamping produced no changes; expected to replace development markers." >&2
            exit 1
          fi
          git commit -m "release: $SEMVER"

          stamped_source_commit="$(git rev-parse HEAD)"

          git fetch origin release || true

          # Files/directories to include in release branch
          FILES_TO_RELEASE=(
            "app"
            "gradle"
            "fastlane"
            "build.gradle.kts"
            "gradle.properties"
            "local.properties"
            "gradlew"
            "gradlew.bat"
            "settings.gradle"
            "LICENSE"
            "NOTICE"
            "README.md"
          )

          # Build release branch history independently from main.
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git switch --force-create release-work refs/remotes/origin/release
          else
            git switch --orphan release-work
          fi

          # Clear tracked files from the branch tip (or orphan index).
          if [ -n "$(git ls-files)" ]; then
            git rm -rf .
          fi

          # Restore only release-branch files from the stamped source commit.
          for item in "${FILES_TO_RELEASE[@]}"; do
            if git cat-file -e "$stamped_source_commit:$item" 2>/dev/null; then
              git restore --source="$stamped_source_commit" --staged --worktree -- "$item"
            fi
          done

          git show "$stamped_source_commit:scripts/release-template-README.md" | sed "s/{{SEMVER}}/$SEMVER/g" > README.md
          git add README.md

          if git diff --cached --quiet; then
            echo "Release branch commit produced no changes; expected at least version stamp or README update." >&2
            exit 1
          fi

          git commit -m "release: v$SEMVER"

          release_commit="$(git rev-parse HEAD)"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

          # Pass by bundle to prevent pushing before tests pass
          git bundle create release-commit.bundle "$release_commit"

      - name: Upload release commit bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-commit-bundle
          path: release-commit.bundle

  tests:
    runs-on: ubuntu-latest
    needs: version_meta
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.dev_tag) || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: release-commit-bundle

      - name: Import release commit from bundle
        run: |
          git fetch ./release-commit.bundle HEAD
          git checkout ${{ needs.version_meta.outputs.release_commit }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run tests
        run: ./gradlew test

  push_release_branch:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.dev_tag) || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: release-commit-bundle

      - name: Import release commit from bundle
        run: git fetch ./release-commit.bundle HEAD

      - name: Push tag and release branch
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.version_meta.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.version_meta.outputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force origin
          git fetch origin release || true

          git checkout "$RELEASE_COMMIT"

          # Push the release tag (points to the stamped commit on release history).
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            existing_tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$existing_tag_sha" != "$RELEASE_COMMIT" ]]; then
              echo "Tag $RELEASE_TAG already exists on $existing_tag_sha; expected $RELEASE_COMMIT." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points to stamped commit; skipping tag creation."
          else
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          git push --force-with-lease origin "$RELEASE_COMMIT:refs/heads/release"

  github_release:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
      - push_release_branch
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.dev_tag) || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: release-commit-bundle

      - name: Import release commit from bundle
        run: |
          git fetch ./release-commit.bundle HEAD
          git checkout ${{ needs.version_meta.outputs.release_commit }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure signing keystore
        run: |
          echo "$ANDROID_SIGNING_KEYSTORE_JKS_B64" | base64 -id > android-signing-keystore.jks
        env:
          ANDROID_SIGNING_KEYSTORE_JKS_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_JKS_B64 }}

      - name: Build signed release APKs
        run: ./gradlew app:assembleFdroidRelease app:assembleGplayRelease
        env:
          SIGNING_KEYSTORE_FILE: ../android-signing-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version_meta.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Upload signed release APK and metadata assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version_meta.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"

          for flavor in fdroid gplay; do
            apk_dir="app/build/outputs/apk/$flavor/release"
            apk_path="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
            metadata_path="$apk_dir/output-metadata.json"

            test -n "$apk_path"
            test -f "$metadata_path"

            gh release upload "$RELEASE_TAG" \
              "$apk_path#net.pfiers.osmfocus-${version}-${flavor}.apk" \
              "$metadata_path#net.pfiers.osmfocus-${version}-${flavor}-output-metadata.json" \
              --clobber
          done

  gplay_deploy:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.dev_tag) || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: release-commit-bundle

      - name: Import release commit from bundle
        run: |
          git fetch ./release-commit.bundle HEAD
          git checkout ${{ needs.version_meta.outputs.release_commit }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure credentials
        run: |
          echo "$ANDROID_SIGNING_KEYSTORE_JKS_B64" | base64 -id > android-signing-keystore.jks
          echo "$PLAY_STORE_CREDENTIALS_JSON_B64" | base64 -id > play-store-credentials.json
        env:
          ANDROID_SIGNING_KEYSTORE_JKS_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_JKS_B64 }}
          PLAY_STORE_CREDENTIALS_JSON_B64: ${{ secrets.PLAY_STORE_CREDENTIALS_JSON_B64 }}

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6
        with:
          ruby-version: '4.0.4'

      - name: Bundle install
        run: bundle install
        working-directory: fastlane

      - name: Fastlane deploy
        run: bundle exec fastlane production
        working-directory: fastlane
        env:
          SIGNING_KEYSTORE_FILE: ../android-signing-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
