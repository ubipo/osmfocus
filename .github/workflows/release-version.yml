name: Release new app version

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional semantic version tag or version expression to release (for example: v1.8.9 or 1.8.9)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  version_meta:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_head_tagged: ${{ steps.meta.outputs.is_head_tagged }}
      fdroid_tag: ${{ steps.meta.outputs.fdroid_tag }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Compute version metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -o pipefail
          bash scripts/vcs_version.sh "${{ github.event.inputs.tag || '' }}" | tee -a "$GITHUB_OUTPUT"
          release_tag="$(grep '^release_tag=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "checkout_ref=refs/tags/$release_tag" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=$CURRENT_REF" >> "$GITHUB_OUTPUT"
          fi

  tests:
    runs-on: ubuntu-latest
    needs: version_meta
    if: github.event_name == 'workflow_dispatch' || needs.version_meta.outputs.is_head_tagged == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.version_meta.outputs.checkout_ref }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run tests
        run: ./gradlew test

  github_release:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.version_meta.outputs.checkout_ref }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure signing keystore
        run: |
          echo "$ANDROID_SIGNING_KEYSTORE_JKS_B64" | base64 -id > android-signing-keystore.jks
        env:
          ANDROID_SIGNING_KEYSTORE_JKS_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_JKS_B64 }}

      - name: Build signed release APKs
        run: ./gradlew app:assembleFdroidRelease app:assembleGplayRelease
        env:
          SIGNING_KEYSTORE_FILE: ../android-signing-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version_meta.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Upload signed release APK and metadata assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version_meta.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"

          for flavor in fdroid gplay; do
            apk_dir="app/build/outputs/apk/$flavor/release"
            apk_path="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
            metadata_path="$apk_dir/output-metadata.json"

            test -n "$apk_path"
            test -f "$metadata_path"

            gh release upload "$RELEASE_TAG" \
              "$apk_path#net.pfiers.osmfocus-${version}-${flavor}.apk" \
              "$metadata_path#net.pfiers.osmfocus-${version}-${flavor}-output-metadata.json" \
              --clobber
          done

  fdroid_tag:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.version_meta.outputs.checkout_ref }}

      - name: Create F-Droid tag if missing
        env:
          FDROID_TAG: ${{ needs.version_meta.outputs.fdroid_tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$FDROID_TAG" >/dev/null; then
            echo "Tag $FDROID_TAG already exists; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          # 41898282 is GitHub's numeric user ID for github-actions[bot]:
          # https://github.com/orgs/community/discussions/26560#discussioncomment-3531273
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$FDROID_TAG"
          git push origin "refs/tags/$FDROID_TAG"

  gplay_deploy:
    runs-on: ubuntu-latest
    needs:
      - version_meta
      - tests
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ needs.version_meta.outputs.checkout_ref }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure credentials
        run: |
          echo "$ANDROID_SIGNING_KEYSTORE_JKS_B64" | base64 -id > android-signing-keystore.jks
          echo "$PLAY_STORE_CREDENTIALS_JSON_B64" | base64 -id > play-store-credentials.json
        env:
          ANDROID_SIGNING_KEYSTORE_JKS_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_JKS_B64 }}
          PLAY_STORE_CREDENTIALS_JSON_B64: ${{ secrets.PLAY_STORE_CREDENTIALS_JSON_B64 }}

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6
        with:
          ruby-version: '4.0.4'

      - name: Bundle install
        run: bundle install
        working-directory: fastlane

      - name: Fastlane deploy
        run: bundle exec fastlane production
        working-directory: fastlane
        env:
          SIGNING_KEYSTORE_FILE: ../android-signing-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
